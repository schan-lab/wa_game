<!DOCTYPE html>
<html lang="ja">
<head>
  <title>けいさんゲーム</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/onsenui/css/onsenui.css">
  <link rel="stylesheet" href="https://unpkg.com/onsenui/css/onsen-css-components.min.css">
  <script src="https://unpkg.com/onsenui/js/onsenui.min.js"></script>
  <style>
    :root {
      --ink: #2f2618;
      --ink-soft: #6b5c45;
      --sand: #fff4df;
      --sand-deep: #f0e0c2;
      --sky: #d9f0f4;
      --leaf: #2a9d8f;
      --coral: #e76f51;
      --amber: #e9a825;
      --spot: #5c4030;
      --white: #fffdf8;
      --shadow: 0 12px 28px rgba(92, 64, 48, 0.14);
      --radius: 28px;
      --font: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overscroll-behavior: none;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(233, 168, 37, 0.22) 0 120px, transparent 121px),
        radial-gradient(circle at 88% 12%, rgba(42, 157, 143, 0.16) 0 100px, transparent 101px),
        radial-gradient(circle at 80% 78%, rgba(231, 111, 81, 0.14) 0 140px, transparent 141px),
        linear-gradient(165deg, var(--sky) 0%, var(--sand) 48%, var(--sand-deep) 100%);
      background-attachment: fixed;
    }

    .page__background {
      background: transparent !important;
    }

    .page__content {
      position: relative;
      text-align: center;
      padding: 20px 24px 48px;
      max-width: 720px;
      margin: 0 auto;
      min-height: calc(100vh - 44px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: fade-up 0.7s ease both;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float-y {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes soft-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .hero {
      margin-bottom: 28px;
    }

    .brand {
      margin: 0 0 6px;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      color: var(--ink);
      line-height: 1.15;
    }

    .brand span {
      color: var(--amber);
    }

    .tagline {
      margin: 0;
      font-size: clamp(1.05rem, 3.5vw, 1.25rem);
      font-weight: 500;
      color: var(--ink-soft);
    }

    .mascot-wrap {
      position: relative;
      width: min(260px, 62vw);
      margin: 18px auto 8px;
      animation: float-y 3.6s ease-in-out infinite;
    }

    .mascot-wrap::before {
      content: '';
      position: absolute;
      inset: 12% 8% auto;
      height: 70%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(233, 168, 37, 0.28), transparent 70%);
      z-index: 0;
      animation: soft-pulse 3.6s ease-in-out infinite;
    }

    .mascot {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 10px 18px rgba(92, 64, 48, 0.18));
    }

    .prompt {
      margin: 8px 0 28px;
      font-size: clamp(1.35rem, 4.5vw, 1.75rem);
      font-weight: 700;
      color: var(--spot);
    }

    .game-buttons-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: stretch;
      justify-content: center;
      margin: 0 auto;
      width: 100%;
      max-width: 440px;
    }

    .game-button {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      width: 100%;
      min-height: 96px;
      border: none;
      border-radius: var(--radius);
      padding: 18px 22px;
      color: var(--white);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    .game-button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.22), transparent 45%);
      pointer-events: none;
    }

    .game-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.03);
    }

    .game-button:active {
      transform: translateY(2px) scale(0.99);
      box-shadow: 0 6px 14px rgba(92, 64, 48, 0.12);
    }

    .addition-button {
      background: linear-gradient(135deg, #3db8c9 0%, #2a9d8f 100%);
    }

    .subtraction-button {
      background: linear-gradient(135deg, #f08a6b 0%, #e76f51 100%);
    }

    .button-icon {
      flex: 0 0 56px;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 2rem;
      font-weight: 900;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(2px);
    }

    .button-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .button-text {
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1.2;
    }

    .button-hint {
      font-size: 0.95rem;
      font-weight: 500;
      opacity: 0.9;
    }

    ons-list-item {
      font-size: 1.35rem !important;
      line-height: 1.5 !important;
      min-height: 64px !important;
    }

    ons-toolbar {
      background: rgba(255, 253, 248, 0.82) !important;
      backdrop-filter: blur(10px);
      box-shadow: 0 1px 0 rgba(92, 64, 48, 0.08);
    }

    ons-toolbar .center {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink);
    }

    ons-toolbar-button {
      transform: scale(1.15);
      margin-left: 8px;
      color: var(--ink) !important;
    }

    .version {
      position: fixed;
      bottom: 12px;
      right: 14px;
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(107, 92, 69, 0.65);
      letter-spacing: 0.04em;
    }

    @media (min-width: 768px) and (orientation: landscape) {
      .game-buttons-container {
        flex-direction: row;
        max-width: 720px;
      }

      .game-button {
        min-height: 120px;
      }
    }

    @media (max-width: 599px) {
      .game-button {
        min-height: 88px;
        gap: 14px;
        padding: 16px 18px;
      }

      .button-icon {
        flex-basis: 48px;
        width: 48px;
        height: 48px;
        font-size: 1.7rem;
        border-radius: 16px;
      }

      .button-text {
        font-size: 1.45rem;
      }
    }
  </style>
</head>

<body>
  <ons-splitter>
    <ons-splitter-side id="menu" side="left" width="280px" collapse swipeable>
      <ons-page>
        <ons-list>
          <ons-list-header>けいさんゲーム</ons-list-header>
          <ons-list-item onclick="location.href='wa.html'" tappable>
            <div class="left">
              <ons-icon icon="md-plus-circle" style="color: #2a9d8f; font-size: 32px;"></ons-icon>
            </div>
            <div class="center">たしざん</div>
          </ons-list-item>
          <ons-list-item onclick="location.href='sa.html'" tappable>
            <div class="left">
              <ons-icon icon="md-minus-circle" style="color: #e76f51; font-size: 32px;"></ons-icon>
            </div>
            <div class="center">ひきざん</div>
          </ons-list-item>
        </ons-list>
      </ons-page>
    </ons-splitter-side>
    <ons-splitter-content id="content" page="home.html"></ons-splitter-content>
  </ons-splitter>

  <template id="home.html">
    <ons-page class="page__background">
      <ons-toolbar>
        <div class="left">
          <ons-toolbar-button onclick="fn.open()">
            <ons-icon icon="md-menu"></ons-icon>
          </ons-toolbar-button>
        </div>
        <div class="center">けいさんゲーム</div>
      </ons-toolbar>

      <div class="page__content">
        <div class="hero">
          <h1 class="brand">けいさん<span>ゲーム</span></h1>
          <p class="tagline">ゲッコーといっしょに、たのしくれんしゅう</p>
          <div class="mascot-wrap">
            <img class="mascot" src="./fig/gecko.png" alt="レオパードゲッコー" width="260" height="260">
          </div>
        </div>

        <p class="prompt">どちらであそぶ？</p>

        <div class="game-buttons-container">
          <button class="game-button addition-button" onclick="location.href='wa.html'">
            <span class="button-icon">+</span>
            <span class="button-copy">
              <span class="button-text">たしざん</span>
              <span class="button-hint">答えてみよう</span>
            </span>
          </button>

          <button class="game-button subtraction-button" onclick="location.href='sa.html'">
            <span class="button-icon">−</span>
            <span class="button-copy">
              <span class="button-text">ひきざん</span>
              <span class="button-hint">答えてみよう</span>
            </span>
          </button>
        </div>

        <div class="version">v1.8</div>
      </div>
    </ons-page>
  </template>

  <script>
    window.fn = {};

    window.fn.open = function() {
      var menu = document.getElementById('menu');
      menu.open();
    };

    window.fn.load = function(page) {
      var content = document.getElementById('content');
      var menu = document.getElementById('menu');
      content.load(page)
        .then(menu.close.bind(menu));
    };

    document.addEventListener('deviceready', function() {
      if (typeof cordova !== 'undefined' && cordova.plugins && cordova.plugins.screensize) {
        cordova.plugins.screensize.setFixedScale(true);
      }

      window.addEventListener('orientationchange', adjustLayout);

      function adjustLayout() {
        const isLandscape = window.innerWidth > window.innerHeight;
        const container = document.querySelector('.game-buttons-container');
        if (!container) return;

        if (isLandscape && window.innerWidth >= 768) {
          container.style.flexDirection = 'row';
        } else {
          container.style.flexDirection = 'column';
        }
      }

      adjustLayout();
    }, false);
  </script>
</body>
</html>
